name: 週次SEO/MEOレポート

# 毎週月曜 9:00（日本時間）に、GA4とSearch Consoleのデータを集計してGitHub Issueにレポートを投稿します。
# Google連携用のSecrets（GOOGLE_SERVICE_ACCOUNT_JSON / GA4_PROPERTY_ID / GSC_SITE_URL）が
# 未設定の間は、エラーにならず「準備中」のメッセージのみでスキップされます。
# 手動で今すぐ試したい場合は、Actionsタブから「Run workflow」でも実行できます。
on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 00:00 UTC = 月曜 9:00 JST
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  weekly-report:
    name: 週次レポート生成
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存ライブラリをインストール
        run: pip install -r scripts/weekly_report/requirements.txt

      - name: レポートを生成
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: python3 scripts/weekly_report/generate_report.py

      - name: GitHub Issueとして投稿
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = fs.existsSync('weekly_report_status.txt')
              ? fs.readFileSync('weekly_report_status.txt', 'utf8').trim()
              : 'skipped';
            if (status !== 'ok') {
              console.log('Google連携の設定が未完了のため、今回はIssueを作成しませんでした。');
              return;
            }
            const body = fs.readFileSync('weekly_report.md', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 週次レポート（${today}）`,
              body,
            });
