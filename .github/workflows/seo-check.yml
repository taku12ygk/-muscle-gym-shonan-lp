name: SEO自動チェック

# PR（変更提案）を作成・更新するたびに、
# title / description / H1 / canonical / robots.txt / sitemap.xml / 画像alt / 内部リンク切れ
# を自動で確認します。デザインや文章を書き換えることは一切ありません（読み取りのみ）。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  seo-check:
    name: SEOチェック
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: SEOチェックを実行
        id: seo
        run: python3 scripts/seo_check.py
        continue-on-error: true

      - name: 結果をPRにコメント
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'seo_report.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- seo-check-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            const commentBody = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }

      - name: チェック結果に応じて成否を決定
        if: steps.seo.outcome == 'failure'
        run: |
          echo "対応が必要な項目があります。PRのコメントを確認してください。"
          exit 1

  lighthouse:
    name: ページ速度・モバイル表示チェック（Lighthouse）
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 簡易サーバーを起動して計測
        uses: treosh/lighthouse-ci-action@v11
        with:
          staticDistDir: "."
          urls: |
            /index.html
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 1
        continue-on-error: true

      - name: 結果の見方メモ
        run: |
          echo "Lighthouseはリポジトリ内のファイルをそのまま簡易サーバーで配信して計測します。"
          echo "結果（表示速度・モバイル対応・SEOスコア等）はこの実行結果画面のSummary、"
          echo "またはArtifacts（zipファイル）からHTMLレポートをダウンロードして確認できます。"
